name: Smoke

"on":
  repository_dispatch:
    types:
      - vercel.deployment.promoted
      # Preview 배포 완료. Production 배포에도 오므로 job의 if로 Preview만 받는다
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      deployment_url:
        description: smoke 대상 URL (비우면 Production 도메인)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Production 승격은 최신 하나만 의미 있고, Preview는 브랜치별로 최신 배포만 검사한다. 수동 실행은 대상 URL별
  group: ${{ github.event.action == 'vercel.deployment.success' && format('smoke-preview-{0}', github.event.client_payload.git.ref) || format('smoke-{0}', inputs.deployment_url || 'production') }}
  cancel-in-progress: true

env:
  # Preview는 이벤트가 알려준 배포별 고유 URL, Production 승격은 고정 도메인(06 8-1), 수동 실행은 입력값
  DEPLOYMENT_URL: ${{ github.event.action == 'vercel.deployment.success' && github.event.client_payload.url || inputs.deployment_url || 'https://loop-pack-fe-l2-vol1-gamma.vercel.app' }}

jobs:
  smoke:
    # success 이벤트는 Production 배포에도 온다. Production은 promoted로만 검사하고 여기서는 Preview만 받는다
    if: github.event.action != 'vercel.deployment.success' || github.event.client_payload.environment == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate deployment URL
        # 이벤트·수동 입력으로 온 대상이 이 프로젝트 배포인지 확인한다 — bypass secret이 다른 호스트로 가지 않게 한다
        # ponytail: 계정 scope 접미사 기준. 다른 계정이 같은 접미사로 이름 지은 도메인은 못 거른다(수동 입력은 쓰기 권한 필요)
        run: |
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://(loop-pack-fe-l2-vol1-gamma|loop-pack-fe-l2-vol1-[a-z0-9-]+-hyeodoong2s-projects)\.vercel\.app/?$ ]]; then
            echo "허용되지 않은 smoke 대상: $DEPLOYMENT_URL" >&2
            exit 1
          fi
      - name: Checkout
        # 이벤트의 git.sha가 아니라 기본 브랜치를 checkout한다(06 8-4). 이벤트가 가리킨 커밋의 코드를 secret과 함께 실행하지 않는다
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Record deployment info
        # 외부에서 온 payload를 run 스크립트에 직접 넣지 않고 환경 변수로 받아 스크립트 주입을 막는다
        env:
          TRIGGER: ${{ github.event_name }}
          PAYLOAD_DEPLOYMENT_ID: ${{ github.event.client_payload.id }}
          PAYLOAD_COMMIT_SHA: ${{ github.event.client_payload.git.sha }}
          PAYLOAD_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          PAYLOAD_GIT_REF: ${{ github.event.client_payload.git.ref }}
        run: |
          {
            echo "### Smoke test target"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| DEPLOYMENT_URL | ${DEPLOYMENT_URL} |"
            echo "| trigger | ${TRIGGER} |"
            echo "| deployment id (client_payload.id) | ${PAYLOAD_DEPLOYMENT_ID:-N/A (manual run)} |"
            echo "| commit SHA (client_payload.git.sha) | ${PAYLOAD_COMMIT_SHA:-N/A (manual run)} |"
            echo "| environment (client_payload.environment) | ${PAYLOAD_ENVIRONMENT:-N/A (manual run)} |"
            echo "| branch (client_payload.git.ref) | ${PAYLOAD_GIT_REF:-N/A (manual run)} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run smoke tests
        # secret은 이 step에만 전달한다
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm test:smoke
