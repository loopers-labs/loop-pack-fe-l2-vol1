name: AI Code Review

# 10주차 4단계 — PR 코멘트에 "@claude"를 멘션할 때만 실행한다(모든 PR 자동 실행 X).
# 이유: 비용·소음을 사람이 명시적으로 부를 때로 제한하기 위함(과제 문서 권장 방식).
on:
  issue_comment:
    types: [created]

# 같은 PR에서 중복으로 여러 번 부르면 이전 실행은 취소한다.
concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  claude-review:
    # PR의 코멘트에서만 반응한다(일반 issue 코멘트는 무시).
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Claude Code Review
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1.0.221
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 규칙 내용 자체는 CLAUDE.md를 자동으로 읽어서 따른다(같은 원리로
          # 이 레포에서 도는 Claude Code 세션은 전부 CLAUDE.md를 로드한다).
          # 여기엔 규칙을 다시 베끼지 않고, "리뷰를 어떻게 수행할지" 행동
          # 지침만 준다 — CLAUDE.md가 바뀌어도 이 프롬프트를 안 고쳐도 되게.
          prompt: |
            이 PR의 diff를 리뷰해줘. 이 레포의 CLAUDE.md에 적힌 컴포넌트
            규칙·상태 분류 기준·FSD 레이어 경계·코드 리뷰 관점을 기준으로
            판단해줘.

            - 스타일(포맷팅)보다 로직·설계 문제를 우선 지적해줘.
            - 문제를 지적할 땐 파일:줄 번호로 구체적으로 짚어줘.
            - 확신이 낮은 지적은 "추정"이라고 표시해줘 — 임의로 단정하지 마.
            - 문제가 없으면 없다고만 말해줘. 억지로 지적을 만들지 마.
