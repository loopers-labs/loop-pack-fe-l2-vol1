name: AI Code Review

# 10주차 4단계 — PR 코멘트에 "@claude"를 멘션할 때만 실행한다(모든 PR 자동 실행 X).
# 이유: 비용·소음을 사람이 명시적으로 부를 때로 제한하기 위함(과제 문서 권장 방식).
on:
  issue_comment:
    types: [created]

# 같은 PR에서 중복으로 여러 번 부르면 이전 실행은 취소한다.
concurrency:
  group: ai-review-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  # claude-code-action이 내부적으로 OIDC 토큰을 발급받는 데 필요(로그로 확인함:
  # "Could not fetch an OIDC token" 에러 → id-token: write 없어서 발생).
  id-token: write

jobs:
  claude-review:
    # PR의 코멘트 중 "@claude"가 실제로 포함된 것에만 반응한다.
    # (10주차 코드 리뷰에서 발견: pull_request 조건만 있고 이 조건이
    # 빠져있어서 PR의 모든 댓글에 반응하고 있었다 — 문서에 적은 "명시적으로
    # 부를 때만"이라는 설계와 실제 동작이 달랐다.)
    #
    # author_association 확인 추가(2차 코드 리뷰에서 발견): 누가 댓글을
    # 달았는지 확인 안 하면, 이 레포에 쓰기 권한 없는 아무나 "@claude"만
    # 써도 pull-requests: write·id-token: write 권한으로 실행이 된다.
    # OWNER/MEMBER/COLLABORATOR만 트리거 가능하도록 제한.
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude') &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # issue_comment 이벤트는 github.sha/github.ref가 PR 브랜치가 아니라
          # default 브랜치(main)를 가리킨다. ref를 명시 안 하면 checkout이
          # main을 받아버려서, 지금까지 이 워크플로가 실제로는 PR 코드가
          # 아니라 main을 리뷰하고 있었다(10주차 코드 리뷰 2차에서 발견).
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Claude Code Review
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1.0.221
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bash는 보안상 기본 비활성화돼 있어(공식 FAQ 확인), diff를 보려고
          # git 명령을 실행하다가 전부 거부당해 리뷰 없이 끝났었다(로그의
          # permission_denials_count: 22). git 읽기 명령만 허용.
          # --max-turns: 2단계에서 겪은 "PR base(main)가 뒤처져 있어 전체
          # 누적 diff를 다 보는 문제"가 여기서도 재현돼 14턴·7분·$0.76이
          # 들었을 가능성이 커서, 폭주 방지로 턴 수를 제한(과제 문서 권장).
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --max-turns 20
          # 규칙 내용 자체는 CLAUDE.md를 자동으로 읽어서 따른다(같은 원리로
          # 이 레포에서 도는 Claude Code 세션은 전부 CLAUDE.md를 로드한다).
          # 여기엔 규칙을 다시 베끼지 않고, "리뷰를 어떻게 수행할지" 행동
          # 지침만 준다 — CLAUDE.md가 바뀌어도 이 프롬프트를 안 고쳐도 되게.
          prompt: |
            이 PR의 diff를 리뷰해줘. 이 레포의 CLAUDE.md에 적힌 컴포넌트
            규칙·상태 분류 기준·FSD 레이어 경계·코드 리뷰 관점을 기준으로
            판단해줘.

            - 이 레포는 브랜치가 주차별로 이어져 있어 PR base(main)가
              많이 뒤처져 있다. **PR 전체 누적 diff가 아니라
              `git diff HEAD~1 HEAD` 결과, 즉 가장 최근 커밋 하나의
              변경분만** 리뷰해줘.
            - 스타일(포맷팅)보다 로직·설계 문제를 우선 지적해줘.
            - 문제를 지적할 땐 파일:줄 번호로 구체적으로 짚어줘.
            - 확신이 낮은 지적은 "추정"이라고 표시해줘 — 임의로 단정하지 마.
            - 문제가 없으면 없다고만 말해줘. 억지로 지적을 만들지 마.
            - SECRET/TOKEN 같은 이름만 보고 "시크릿 노출"이라고 판단하지
              말고, 그 값이 실제로 민감한지(플레이스홀더·주석 문맥 포함)
              확인한 뒤에 지적해줘.
