name: Quality

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # 10주차 CI 측정용 — Actions 탭에서 수동으로 재실행하기 위해 추가

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # paths-filter가 이번 push 구간(before..after)을 로컬 git으로 비교할 수 있도록
          # 최소한의 히스토리를 가져온다. 전체 히스토리(fetch-depth: 0)는 1단계에서
          # 최적화한 checkout 속도를 다시 늦출 수 있어 적당한 값으로 제한.
          fetch-depth: 50
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # PR 전체 누적 diff(=base) 대신, 이번 push로 새로 추가된 커밋만 비교한다.
          # 이 레포는 주차별 브랜치가 이어져 있어 PR의 base(main)가 한참 뒤처져 있고,
          # 그 상태로 기본 동작(PR 전체 diff)을 쓰면 필터가 사실상 항상 true가 된다.
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          filters: |
            e2e:
              - 'src/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'next.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium when used
        if: steps.filter.outputs.e2e == 'true'
        run: |
          if pnpm exec playwright --version >/dev/null 2>&1; then
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Run quality checks
        run: pnpm check
      - name: Run E2E tests
        if: steps.filter.outputs.e2e == 'true'
        run: pnpm test:e2e
