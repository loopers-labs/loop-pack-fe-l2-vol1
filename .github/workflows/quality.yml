name: Quality

'on':
  push:
    branches:
      - main
  pull_request:
    # ready_for_review가 없으면 draft를 푼 순간 재실행이 걸리지 않는다.
    # draft에서 E2E를 아끼는 판단과 짝이다.
    types: [opened, synchronize, reopened, ready_for_review]
  # 조건부 스킵의 최종 방어선이다. PR에서 생략한 검증을 main에 들어가기 직전에 한 번
  # 더 돈다. 이 트리거가 없으면 스킵을 되짚는 지점이 어디에도 없다.
  merge_group:
  # 같은 조건에서 반복 측정하려고 연다. PR을 새로 만들지 않고 실행 시간을 잴 수 있다.
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치의 오래된 실행만 취소한다. group 에 ref 가 없으면 main push 까지 취소된다.
# cancel-in-progress 를 이벤트로 가르는 이유도 같다. PR 은 다음 push 가 답이지만
# main push 는 그 자체가 기록이라 중간에 끊으면 안 된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 브라우저도 production build 산출물도 필요 없는 검증이다. 앞 구성에서는 build·E2E
  # 뒤에 직렬로 붙어 있었지만 서로 의존하지 않는다. 이 job은 Playwright 설치 27초를
  # 치르지 않는다.
  #
  # 측정 근거는 week10-ci.md C절에 있다. 단일 job 중앙값 119초, 2 job 임계경로 중앙값
  # 90초(warm 6회)다. 2 job 표본 6개 중 5개가 단일 job 최소값 106초보다 낮다.
  # 범위는 위쪽에서 겹친다 — 공유 러너 변동이 우리가 줄인 폭과 같은 자리수다.
  # 대신 총 runner 시간은 119초에서 137초로 늘었다. 기다리는 시간을 compute와 바꿨다.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # 커밋 메시지 게이트가 base...head 범위를 읽는다.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 로컬 훅은 --no-verify로 넘길 수 있다. 같은 판정을 CI에서 한 번 더 한다.
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/commit/check-message.mjs --range
          "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Architecture check
        run: pnpm architecture:check
      - name: Unit and DOM tests
        run: pnpm test

      # 게이트 자체의 계약을 게이트보다 먼저 고정한다. 승격한 룰과 스크립트는
      # 패턴 문자열 하나만 빠져도 다시 통과하고, 그때 본 게이트는 성공으로 남는다.
      - name: Test promoted lint rule
        run: pnpm lint:rule:test
      - name: Lint
        run: pnpm lint
      - name: Test comment style gate
        run: pnpm style:test
      - name: Check comment style
        run: pnpm style:check
      - name: Test commit message gate
        run: pnpm commit:test
      - name: Test E2E decision
        run: pnpm ci:test
      # CI 구성 자체를 검사한다. 되돌린 실수 셋(배포 SHA checkout, Dockerfile 기본값,
      # workflow와 check의 드리프트)이 다시 들어오면 여기서 막힌다.
      - name: Test CI audit
        run: pnpm ci:audit:test
      - name: Audit CI configuration
        run: pnpm ci:audit
      - name: Test environment validation
        run: pnpm env:test
      - name: Test bundle budget
        run: pnpm size:test

      - name: Typecheck
        run: pnpm typecheck

  # 브라우저와 production build가 필요한 검증만 남긴다. Storybook 테스트는 chromium을
  # 쓰고, 번들 예산과 E2E는 같은 job의 .next를 읽는다. 이 셋은 갈라지지 않는다.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 배포 URL 증거가 아니라 build 계약을 검증하는 값이다.
    # 서버 metadata와 prefetch가 절대 URL을 만들려면 build 시점에 origin이 있어야 한다.
    env:
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # E2E 판정이 base...head 경로를 직접 비교한다. 외부 changed-files 액션과
          # pull-requests: read 권한을 추가하지 않아도 된다.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright 설치를 둘로 나눈다. 이전에는 `install --with-deps` 하나라
      # apt 의존성과 브라우저 다운로드가 한 단계로 합쳐져 어느 쪽이 느린지 알 수 없었다.
      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium
      - name: Download Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Storybook tests
        run: pnpm test:storybook
      - name: Validate environment
        run: pnpm env:check
      - name: Build
        run: pnpm build
      - name: Check bundle budget
        run: pnpm size:check
      - name: Build Storybook
        run: pnpm build:storybook

      # 판정을 YAML 밖으로 뺀다. 앞 구현은 30줄 인라인 bash라 테스트가 없었고,
      # 그래서 허용 목록이 fail-open이라는 것을 아무도 잡지 못했다.
      # 지금은 무해 목록에만 해당할 때 생략하고 모르는 경로는 실행한다.
      - name: Decide whether E2E is required
        id: e2e-changes
        run: >-
          node scripts/ci/decide-e2e.mjs
          --event "${{ github.event_name }}"
          --draft "${{ github.event.pull_request.draft }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: E2E
        id: e2e
        if: steps.e2e-changes.outputs.run_e2e == 'true'
        run: pnpm test:e2e:prebuilt
      - name: Upload E2E failure artifacts
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7
