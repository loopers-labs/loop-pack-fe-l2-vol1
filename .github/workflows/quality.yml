name: Quality

"on":
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ORIGIN: http://127.0.0.1:3100
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Select dependency cache scope
        env:
          IS_MEASUREMENT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'measure-ci') }}
        run: |
          if [ "$IS_MEASUREMENT" = "true" ]; then
            printf 'measurement-%s\n' "$GITHUB_RUN_ID" > .ci-cache-scope
          else
            printf 'shared\n' > .ci-cache-scope
          fi
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .ci-cache-scope
      - name: Decide E2E scope
        id: plan
        run: pnpm ci:plan
      - name: Toolchain versions
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Test CI policy
        id: ci_tests
        run: pnpm test:ci
      - name: Validate CI environment
        id: environment
        run: pnpm validate:env ci
      - name: Unit and integration tests
        id: test
        run: pnpm test
      - name: Lint
        id: lint
        run: pnpm lint
      - name: Typecheck
        id: types
        run: pnpm typecheck
      - name: Production build
        id: build
        run: pnpm build
      - name: Check JavaScript bundle budgets
        id: bundle
        run: pnpm bundle:check
      - name: Install Playwright system dependencies
        id: browser_deps
        if: steps.plan.outputs.e2e == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Download Chromium
        id: browser
        if: steps.plan.outputs.e2e == 'true'
        run: pnpm exec playwright install chromium
      - name: E2E against the production build
        id: e2e
        if: steps.plan.outputs.e2e == 'true'
        run: pnpm test:e2e:run
      - name: Verify outcomes and write summary
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          E2E_REQUIRED: ${{ steps.plan.outputs.e2e }}
          E2E_REASON: ${{ steps.plan.outputs.reason }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
        run: pnpm ci:gate

  merge-gate:
    name: merge-gate
    if: always()
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful quality job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          printf 'Quality job: %s\n' "$QUALITY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$QUALITY_RESULT" = success
