name: Quality

"on":
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Filter changed paths
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            e2e:
              # Workflow changes must exercise the full quality path.
              - "src/**"
              - "e2e/**"
              - "public/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - ".size-limit.json"
              - "scripts/**"
              - "playwright.config.*"
              - "next.config.*"
              - "postcss.config.*"
              - "tsconfig.json"
              - "vitest.config.*"
              - ".nvmrc"
              - ".github/workflows/quality.yml"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
    if: ${{ needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e

  budget:
    name: Budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
    if: ${{ needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    env:
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_SESSION_SECRET: ${{ github.event_name == 'pull_request' && 'ci-week10-budget-secret' || secrets.AUTH_SESSION_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate environment
        run: pnpm validate:env
      - name: Build
        run: pnpm build
      - name: Check bundle budget
        run: |
          set -o pipefail
          pnpm budget:bundle | tee /tmp/size-limit.txt
      - name: Write budget summary
        if: ${{ always() }}
        run: |
          {
            echo "## Bundle budget"
            echo
            echo '```txt'
            if [ -f /tmp/size-limit.txt ]; then
              cat /tmp/size-limit.txt
            else
              echo "size-limit did not run."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - changes
      - checks
      - e2e
      - budget
    steps:
      - name: Complete quality checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_SHOULD_RUN: ${{ needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BUDGET_RESULT: ${{ needs.budget.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$CHECKS_RESULT" = "success"
          if [ "$E2E_SHOULD_RUN" = "true" ]; then
            test "$E2E_RESULT" = "success"
            test "$BUDGET_RESULT" = "success"
          else
            test "$E2E_RESULT" = "skipped"
            test "$BUDGET_RESULT" = "skipped"
          fi
