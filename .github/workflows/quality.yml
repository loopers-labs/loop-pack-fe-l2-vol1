name: Quality

"on":
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

# 같은 PR 의 연속 push 는 이전 실행을 취소하고, main push 는 절대 취소하지 않는다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  APP_ORIGIN: http://localhost:3000

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate route types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit and integration tests
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # 세션 서명 키는 요청 시점에 읽히므로 빌드 산출물에 들어가지 않는다. CI 마다 새로 만들고 마스킹한다
      - name: Generate ephemeral session secret
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "AUTH_SESSION_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Validate environment
        run: pnpm validate-env

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: |
          status=0
          pnpm exec size-limit --json > "$RUNNER_TEMP/size-limit.json" || status=$?
          node scripts/size-limit-summary.mjs "$RUNNER_TEMP/size-limit.json"
          exit $status

      - name: Assert the session secret is not in the build output
        run: |
          if grep -rqF "$AUTH_SESSION_SECRET" .next/static .next/server; then
            echo "::error::AUTH_SESSION_SECRET 값이 빌드 산출물에 들어 있습니다"
            exit 1
          fi

      - name: Detect app-affecting changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app:
              - "src/**"
              - "e2e/**"
              - "public/**"
              - "playwright.config.ts"
              - "next.config.ts"
              - "tsconfig.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - ".github/workflows/quality.yml"
              - ".github/actions/**"

      # 이벤트 값은 run 본문에 보간하지 않고 env 로 넘긴다 (스크립트 인젝션 방지)
      - name: Decide whether E2E runs
        id: e2e
        env:
          EVENT: ${{ github.event_name }}
          APP_CHANGED: ${{ steps.filter.outputs.app }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
        run: |
          decide() {
            echo "run=$1" >> "$GITHUB_OUTPUT"
            printf '### E2E: %s\n\n%s\n\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
            echo "e2e run=$1 — $2"
          }
          if [ "$EVENT" = "push" ]; then decide true "main push: 머지된 트리 전체를 검증한다"; exit 0; fi
          if [ "$LABELED" = "true" ]; then decide true "run-e2e 라벨: 사람이 명시적으로 요청했다"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then decide false "draft PR: 작성 중이라 비싼 검증을 미룬다"; exit 0; fi
          if [ "$APP_CHANGED" = "true" ]; then decide true "앱 경로 변경: build·start·Playwright 의 입력이 바뀌었다"; exit 0; fi
          decide false "문서·설정만 변경: E2E 의 입력이 바뀌지 않았다"

      - name: Resolve Playwright version
        id: playwright
        if: steps.e2e.outputs.run == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        if: steps.e2e.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.e2e.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E on the production build
        if: steps.e2e.outputs.run == 'true'
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 3
          if-no-files-found: ignore
