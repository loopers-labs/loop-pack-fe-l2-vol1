name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 같은 PR에 연속으로 push하면 앞선 run을 취소한다.
# 키에 ref를 넣어 브랜치별로 가른다 — 넣지 않으면 main push의 run까지 같이 취소된다.
# 이건 run 하나의 wall-clock을 줄이는 최적화가 아니라 낭비되는 run을 줄이는 것이다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 1단계 측정 결과(docs/rfc/week10-ci.md): 한 job에서 pnpm check를 직렬로 돌리면
# job 98초 중 검증 46초 + 브라우저 설치 24초가 71%였다. lint·typecheck·test는 서로
# 독립이므로 job으로 가른다. build는 E2E가 그 산출물 위에서 돌므로 같은 job에 둔다.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Unit·integration tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      # 브라우저 바이너리는 pnpm store 밖(~/.cache/ms-playwright)에 있어서
      # setup-node의 캐시가 덮지 않는다. 측정에서 이 설치가 24초로 두 번째 병목이었다.
      # 캐시 내용물은 Playwright 버전에만 달려 있다. 키를 lockfile 전체 해시로 잡으면
      # 무관한 의존성 하나만 바뀌어도 270MB를 다시 받는다.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "value=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}
      # apt 쪽과 바이너리 쪽을 갈라 재 봤더니 24초는 apt 16초 + 다운로드 10초였다.
      # 그리고 apt 로그에는 설치가 없다 — 필요한 라이브러리가 ubuntu-24.04 러너 이미지에
      # 이미 다 들어 있어서 매 실행 16초를 쓰고 아무것도 안 깔았다. 그래서 install-deps를 뺀다.
      # 러너 이미지가 라이브러리를 빼면 chromium이 뜨지 않아 이 job이 빨간불이 된다 —
      # 그때는 이 자리에 `pnpm exec playwright install-deps chromium`을 되살린다.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Build
        run: pnpm build
      - name: E2E
        run: pnpm test:e2e
